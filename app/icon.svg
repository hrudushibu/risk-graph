<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Risk Graph: Graph nodes and edges representing security relationships -->
  <rect width="64" height="64" rx="14" fill="#5B3DF5"/>
  <!-- Central node -->
  <circle cx="32" cy="32" r="7" fill="white"/>
  <!-- Satellite nodes -->
  <circle cx="14" cy="18" r="5" fill="white" fill-opacity="0.75"/>
  <circle cx="50" cy="18" r="5" fill="white" fill-opacity="0.75"/>
  <circle cx="14" cy="46" r="5" fill="white" fill-opacity="0.55"/>
  <circle cx="50" cy="46" r="5" fill="white" fill-opacity="0.55"/>
  <!-- Edges from center -->
  <line x1="26" y1="27" x2="18" y2="22" stroke="white" stroke-width="2" stroke-opacity="0.8"/>
  <line x1="38" y1="27" x2="46" y2="22" stroke="white" stroke-width="2" stroke-opacity="0.8"/>
  <line x1="26" y1="37" x2="18" y2="42" stroke="white" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="38" y1="37" x2="46" y2="42" stroke="white" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Cross edges -->
  <line x1="19" y1="18" x2="45" y2="18" stroke="white" stroke-width="1.5" stroke-opacity="0.4"/>
  <line x1="19" y1="46" x2="45" y2="46" stroke="white" stroke-width="1.5" stroke-opacity="0.4"/>
</svg>
